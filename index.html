
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hai 😹</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

.container {
  padding: 25px;
}

h1 {
  font-size: 30px;
  animation: muncul 1.5s ease;
}

p {
  font-size: 22px;
}

.sticker {
  position: fixed;
  font-size: 90px;
  animation: goyang 2s infinite ease-in-out;
}

.top {
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
}

.bottom-left {
  bottom: 20px;
  left: 15px;
}

@keyframes goyang {
  0%, 100% { transform: rotate(-10deg); }
  50% { transform: rotate(10deg) scale(1.1); }
}

@keyframes muncul {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div class="sticker top">🤣</div>
<div class="sticker bottom-left">😂</div>

<div class="container">
  <h1>HAI apakah TUMO sehat?</h1>
  <p>Btw nyariin kisi-kisi? 😹😹😹</p>
</div>

</body>
</html>
